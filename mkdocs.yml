site_name: ERP Casa Chalar - Documentación
site_description: Manuales de usuario y documentación del sistema ERP Casa Chalar
site_url: https://adrianbot-cmd.github.io/casachalar-erp-docs/
repo_url: https://github.com/adrianbot-cmd/casachalar-erp-docs
repo_name: casachalar-erp-docs
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Inicio: index.md
  - Briefing del Proyecto: BRIEFING-CARLOS.md
  - Manuales de Usuario:
    - Primeros pasos: manuales/primeros-pasos.md
    - Módulo Ventas: manuales/ventas.md
    - Módulo Compras: manuales/compras.md
    - Módulo Tesorería: manuales/tesoreria.md
  - Módulos:
    - Artículos: modulos/articulos.md
    - Clientes: modulos/clientes.md
    - Proveedores: modulos/proveedores.md
    - Stock: modulos/stock.md
    - Listas de Precio: modulos/listas-precio.md
    - Usuarios: modulos/usuarios.md
    - Tipo de Cambio: modulos/tipo-cambio.md
    - Catálogos:
      - Rubros / Familias / Categorías: modulos/categorias.md
    - Almacenes:
      - Depósitos: modulos/depositos.md
    - Ventas:
      - Cotizaciones: modulos/cotizaciones.md
      - Pedidos: modulos/pedidos.md
      - Facturas: modulos/facturas.md
      - Recibos de Cobro: modulos/recibos-cobro.md
    - Tesorería:
      - Bancos: modulos/bancos.md
      - Cheques: modulos/cheques.md
      - Cashflow: modulos/cashflow.md
    - Compras:
      - Requerimientos: modulos/compras/requerimientos.md
      - Cotizaciones de Compra: modulos/compras/cotizaciones-compra.md
      - Órdenes de Compra: modulos/compras/ordenes-compra.md
      - Recepciones: modulos/compras/recepciones.md
      - Cuentas por Pagar: modulos/compras/facturas-proveedor.md
  - Documentación Técnica:
    - Arquitectura: arquitectura/overview.md
    - Guía de Deploy: deploy/guia-deploy.md
    - Decisiones (ADRs):
      - ADR-001 Stack: decisiones/ADR-001-stack.md
      - ADR-002 Arquitectura de Negocio: decisiones/ADR-002-arquitectura-negocio.md
      - ADR-003 Maestros del Sistema: decisiones/ADR-003-maestros-del-sistema.md
      - ADR-004 Capa 3 - Usuarios y Stock: decisiones/ADR-004-capa3-usuarios-stock.md
      - ADR-005 Módulo Ventas: decisiones/ADR-005-ventas-comprobantes.md
      - ADR-006 Módulo Compras: decisiones/ADR-006-compras.md

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - codehilite
  - tables
  - toc:
      permalink: true
